[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = [
    ".venv",
    "media",
    "reports_output",
    "staticfiles",
    "**/migrations/*.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["apps", "tour_monitor"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
